<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Apps Website</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/tesseract.min.js" defer></script>
    <script src="assets/script.js" defer></script>
</head>

<body>
    <h2>Extract text from an image</h2>
    <p>This project is inspired by <a href="https://promoberkahkemilau.com" target="_blank" rel="noopener noreferrer">Promo Berkah Kemilau by Indolakto</a>.</p>

    <div class="box">
        <label for="pilih-gambar">Choose an image:</label>
        <input type="file" id="pilih-gambar" accept="image/*">
    </div>

    <div>Status: <span id="status" aria-live="polite">Waiting for an image</span></div>

    <h3>Result text:</h3>
    <textarea id="hasil-teks" placeholder="The extracted text will appear here..." readonly></textarea>

    <footer><p>Project by <a href="https://naturbrilian.nekoweb.org" target="_blank" rel="noopener noreferrer">Natur Brilian</a></p></footer>
</body>
</html>
